services:
  campus-motion:
    build:
      context: .
      args:
        # Reads VITE_API_URL from your shell or a .env file at compose level
        VITE_API_URL: ${VITE_API_URL}
    image: campus-motion:latest
    container_name: campus-motion-admin
    restart: unless-stopped
    ports:
      - "3002:3002"
